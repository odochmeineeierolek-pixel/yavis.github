name: Build YAVIS
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: EXE bauen
        run: pyinstaller --noconfirm --clean --windowed --name YAVIS --collect-submodules yavis --add-data "examples;examples" run_yavis.py
      - name: Selbsttest der fertigen EXE
        timeout-minutes: 5
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath "dist\YAVIS\YAVIS.exe" -ArgumentList "--selftest","selftest.txt" -Wait -PassThru
          if (Test-Path selftest.txt) { Get-Content selftest.txt } else { Write-Host "KEINE AUSGABE - die EXE ist beim Start abgestuerzt" }
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Portable ZIP
        run: Compress-Archive -Path dist\YAVIS -DestinationPath YAVIS-portable.zip
      - name: Installer (Setup.exe) - optional
        continue-on-error: true
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: YAVIS-Windows
          path: |
            YAVIS-portable.zip
            installer_out/YAVIS-Setup.exe
          if-no-files-found: warn
      - name: Release veroeffentlichen (nur bei Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            YAVIS-portable.zip
            installer_out/YAVIS-Setup.exe
